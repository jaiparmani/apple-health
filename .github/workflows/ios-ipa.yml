name: iOS IPA

# Every change to the iOS app produces a fresh HealthSync.ipa, attached to the
# rolling "ios-latest" release (stable download link) and to the run itself.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-ipa.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build IPA
        run: |
          chmod +x ios/build-ipa.sh
          ios/build-ipa.sh "${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: HealthSync-${{ github.run_number }}
          path: ios/build/HealthSync.ipa

      - name: Publish to ios-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          NOTES="Build ${{ github.run_number }} from ${SHORT}: $(git log -1 --pretty=%s)"
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release upload ios-latest ios/build/HealthSync.ipa --clobber
            gh release edit ios-latest --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create ios-latest ios/build/HealthSync.ipa --title "HealthSync (latest)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
