name: HealthSync
options:
  bundleIdPrefix: com.jaiparmani
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: C88HGTZJ68
    CODE_SIGN_STYLE: Automatic

targets:
  HealthSync:
    type: application
    platform: iOS
    sources:
      - HealthSync
    dependencies:
      - target: HealthSyncWidgetExtension
    settings:
      base:
        INFOPLIST_FILE: HealthSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthSync/HealthSync.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.jaiparmani.HealthSync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: HealthSync/HealthSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.jaiparmani.HealthSync

  HealthSyncWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - HealthSyncWidget
    settings:
      base:
        INFOPLIST_FILE: HealthSyncWidget/Info.plist
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: HealthSyncWidget
        CODE_SIGN_ENTITLEMENTS: HealthSyncWidgetExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.jaiparmani.HealthSync.HealthSyncWidget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: HealthSyncWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jaiparmani.HealthSync
