name = "apple-health"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
GITHUB_OWNER = "jaiparmani"
GITHUB_REPO = "apple-health"
GITHUB_DATA_BRANCH = "main"
LLM_GATEWAY_URL = "https://llm-gateway.brain-store.workers.dev"
TIMEZONE = "Asia/Kolkata"
PUBLIC_URL = "https://apple-health.brain-store.workers.dev"

[[kv_namespaces]]
binding = "INSIGHTS_CACHE"
id = "6814485a982543cfbf487dcadd4478d4"

# Service binding to llm-gateway: a worker can't fetch() another worker's
# *.workers.dev hostname directly (Cloudflare error 1042, same-zone subrequest
# restriction) — a service binding calls it in-process instead, bypassing that.
[[services]]
binding = "LLM_GATEWAY"
service = "llm-gateway"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   INGEST_TOKEN      - bearer token the Apple Shortcut must send
#   GITHUB_TOKEN      - PAT with repo contents read/write on jaiparmani/apple-health
#   LLM_GATEWAY_TOKEN - client token issued by llm-gateway for the AI insights feature
#   BRIEF_TOKEN       - bearer token brain-chat and telegram-router send to POST /telegram/brief
#                       (stored there as APPLE_HEALTH_TOKEN)

# Hourly at :15 — pre-writes every AI review whose data changed (or that's
# >6h old / from yesterday) and this week's plan, so the dashboard opens with
# everything already there. The 01:15 UTC run (06:45 IST) also covers the
# 07:00 IST Telegram brief. Syncs trigger the same warm-up immediately.
[triggers]
crons = ["15 * * * *"]
